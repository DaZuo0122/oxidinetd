[package]
name = "oxidinetd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oi"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

[dependencies]
smol = "1.3"
async-channel = "1.9"
futures-lite = "2.0"
ctrlc = "3.4"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.9.5"
clap = { version = "4.5.43", features = ["derive"] }

[dev-dependencies]
rcgen = { version = "0.14.8", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
serde_json = "1.0.151"
tempfile = "3.27.0"
test-case = "3.3.1"

[target."cfg(windows)".dev-dependencies]
winapi = { version = "0.3.9", features = ["winbase", "processthreadsapi", "handleapi", "wincon", "consoleapi", "errhandlingapi", "synchapi", "winnt"] }
