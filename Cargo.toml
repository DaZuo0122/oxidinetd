[package]
name = "oxidinetd"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "oi"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1

[features]
tcp-profile = []

[dependencies]
tokio = { version = "1.54.1", features = ["full"] }
ctrlc = "3.5.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async", "html_reports"] }
mio = { version = "1.2.4", default-features = false, features = ["net", "os-poll"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2.2.0"
serde_json = "1.0.154"
socket2 = "0.6.5"
tempfile = "3.27.0"
test-case = "3.4.1"

[target."cfg(windows)".dev-dependencies]
winapi = { version = "0.3.9", features = ["winbase", "processthreadsapi", "handleapi", "wincon", "consoleapi", "errhandlingapi", "synchapi", "winnt", "processenv", "fileapi", "winerror"] }

[target."cfg(unix)".dev-dependencies]
libc = "0.2.191"

[[bench]]
name = "tcp_throughput"
harness = false

[[bench]]
name = "tcp_latency"
harness = false

[[bench]]
name = "udp_throughput"
harness = false

[[bench]]
name = "cross_protocol"
harness = false

[[bench]]
name = "concurrent"
harness = false

[[bench]]
name = "tcp_diagnostics"
harness = false
